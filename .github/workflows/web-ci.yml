name: Web CI
# CI runs typecheck, production build, and lightweight regression smoke checks.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'web/**'
      - 'public/**'
      - 'content/**'
      - 'scripts/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'web/**'
      - 'public/**'
      - 'content/**'
      - 'scripts/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build and smoke-test Web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Regression smoke test
        run: npm run test:smoke

      - name: Prayer and Qibla regression vectors
        run: npm run test:prayer

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: islamic-knowledge-platform-web
          path: dist
